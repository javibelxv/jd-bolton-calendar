name: Update JD Bolton class calendar

on:
  schedule:
    # Every 6 hours (UTC). The gym page shows 7 days ahead, so new days appear daily.
    - cron: "23 */6 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape timetable and build calendar
        run: python jd_bolton_ics.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No timetable changes."
          else
            git commit -m "Update class calendar"
            git push
          fi
