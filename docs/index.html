<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JD Bolton Classes</title>
<style>
  :root { --bg:#0b0b0b; --fg:#f4f4f4; --muted:#a3a3a3; --accent:#3ddc84; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:1.6rem; margin:0 0 8px; }
  p { color:var(--muted); }
  a.btn { display:block; text-align:center; background:var(--accent); color:#000; font-weight:700;
          padding:14px; border-radius:10px; text-decoration:none; margin:24px 0 12px; }
  code { display:block; word-break:break-all; background:#1b1b1b; padding:10px; border-radius:8px; color:var(--fg); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>JD Gyms Bolton classes</h1>
  <p>Auto-updated every 6 hours from the gym's public timetable. No booking needed.</p>
  <a class="btn" id="sub" href="#">Subscribe in Calendar</a>
  <p>Or paste this URL into a calendar subscription:</p>
  <code id="url"></code>
</main>
<script>
  const https = new URL('jd-bolton-classes.ics', location.href).href;
  document.getElementById('url').textContent = https;
  document.getElementById('sub').href = https.replace(/^https?:/, 'webcal:');
</script>
</body>
</html>
